
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ course.name }}</title>

    <!-- Bootstrap styling -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">
                Online Course
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <!-- Display the course name -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h1 class="text-primary">{{ course.name }}</h1>
                <p class="text-muted">{{ course.description }}</p>
            </div>
        </div>

        <!-- Display all lessons related to the course -->
        <h2 class="mb-3">Course Lessons</h2>

        {% for lesson in course.lesson_set.all %}
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-info text-white">
                    <h3 class="h5 mb-0">{{ lesson.title }}</h3>
                </div>

                <div class="card-body">
                    <p class="card-text">{{ lesson.content }}</p>
                </div>
            </div>
        {% empty %}
            <div class="alert alert-info">
                No lessons are available for this course.
            </div>
        {% endfor %}

    </main>

</body>
</html>
